services:
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    ports:
      - "3000:80"
    volumes:
      - ./bridges/ThreatIntelBridge.php:/config/ThreatIntelBridge.php:ro
      - ./lib/ThreatIntel:/app/lib/ThreatIntel:ro
      - ./dashboard.php:/app/dashboard.php:ro
      - ./event.php:/app/event.php:ro
      - ./data:/app/data
      - ./cache/nvd:/app/cache/nvd
    restart: unless-stopped

  feed-updater:
    image: curlimages/curl:latest
    depends_on:
      - rss-bridge
    command:
      - sh
      - -c
      - |
        while true; do
          curl -s "http://rss-bridge/?action=display&bridge=ThreatIntelBridge&format=Json" > /dev/null
          sleep 180
        done
    restart: unless-stopped
